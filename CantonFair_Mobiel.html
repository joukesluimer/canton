const STORAGE_KEY = 'canton2026_tegeldepot_v1';
let state = loadState();
let currentCat = 'kranen';
let searchTerm = '';
let onlyFilledFilter = false;

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      if (!parsed.suppliers) parsed.suppliers = [];
      return parsed;
    }
  } catch(e){}
  return { rate: 0.92, entries: {}, suppliers: [] };
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function getEntry(id) {
  if (!state.entries[id]) state.entries[id] = { fob:'', supplier:'', note:'' };
  return state.entries[id];
}

function computeFactor(item, offerFob) {
  if (!offerFob || isNaN(offerFob)) return null;
  const rate = parseFloat(state.rate) || 0.92;
  let offerEur = offerFob;
  if (item.currency === 'USD') offerEur = offerFob * rate;
  const vkp = item.target_vkp_eur;
  if (vkp) return vkp / offerEur;
  // For drukplaten/keramiek without VKP reference
  if (item.target_fob_eur) {
    // show ratio vs target fob
    return null;
  }
  return null;
}

function computeStatus(item, offerFob) {
  if (!offerFob || isNaN(offerFob)) return null;
  const rate = parseFloat(state.rate) || 0.92;
  let offerEur = offerFob;
  if (item.currency === 'USD') offerEur = offerFob * rate;
  const target = item.target_fob_eur;
  if (!target) return null;
  if (offerEur <= target) return 'ok';
  if (offerEur <= target * 1.15) return 'warn';
  return 'bad';
}

function fmtEur(v) { return v == null ? '—' : '€' + v.toFixed(2).replace('.', ','); }
function fmtUsd(v) { return v == null ? '—' : '$' + v.toFixed(2); }
function fmtFactor(v) { return v == null ? '—' : v.toFixed(2).replace('.', ','); }

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  Object.keys(CATALOG).forEach(k => {
    const c = CATALOG[k];
    const b = document.createElement('button');
    b.className = 'tab' + (k === currentCat ? ' active' : '');
    b.innerHTML = `${c.icon} ${c.label}<span class="count">${c.items.length}</span>`;
    b.onclick = () => { currentCat = k; searchTerm=''; document.getElementById('search').value=''; renderAll(); };
    tabs.appendChild(b);
  });
  // Supplier tab
  const sb = document.createElement('button');
  sb.className = 'tab' + (currentCat === 'suppliers' ? ' active' : '');
  sb.innerHTML = `🏭 Leveranciers<span class="count">${(state.suppliers||[]).length}</span>`;
  sb.onclick = () => { currentCat = 'suppliers'; searchTerm=''; document.getElementById('search').value=''; renderAll(); };
  tabs.appendChild(sb);
}

function renderIntro() {
  const c = CATALOG[currentCat];
  document.getElementById('intro').textContent = c.note || '';
}

function renderStats() {
  const c = CATALOG[currentCat];
  document.getElementById('stats').innerHTML = `<span>${c.items.length} producten in deze categorie</span>`;
}

function renderItems() {
  const c = CATALOG[currentCat];
  const container = document.getElementById('items');
  container.innerHTML = '';
  const term = searchTerm.toLowerCase();
  let items = c.items.filter(item => {
    if (term) {
      const hay = (item.name+' '+item.spec+' '+(item.color||'')).toLowerCase();
      if (!hay.includes(term)) return false;
    }
    return true;
  });
  if (!items.length) {
    container.innerHTML = '<div class="empty">Geen items</div>';
    return;
  }
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';

    // Build reference badges
    let refs = '';
    if (item.benchmark_fob_usd) refs += `<div class="ref-badge">Benchmark USD<br><b>$${item.benchmark_fob_usd.toFixed(2)}</b></div>`;
    if (item.benchmark_eur) refs += `<div class="ref-badge">${item.benchmark_label||'Benchmark'}<br><b>${fmtEur(item.benchmark_eur)}</b></div>`;
    if (item.target_fob_eur) refs += `<div class="ref-badge target">Target FOB<br><b>${fmtEur(item.target_fob_eur)}</b></div>`;
    if (item.target_vkp_eur) refs += `<div class="ref-badge">Target VKP<br><b>${fmtEur(item.target_vkp_eur)}</b></div>`;

    // Expand glass colors if present
    let colorTiers = '';
    if (item.benchmark_fob_usd_black || item.benchmark_fob_usd_carrara || item.benchmark_fob_usd_gold) {
      colorTiers += '<div class="ref-row" style="margin-top:4px;">';
      if (item.benchmark_fob_usd_black) colorTiers += `<div class="ref-badge">Zwart/Grijs<br><b>$${item.benchmark_fob_usd_black.toFixed(2)}</b></div>`;
      if (item.benchmark_fob_usd_carrara) colorTiers += `<div class="ref-badge">Carrara<br><b>$${item.benchmark_fob_usd_carrara.toFixed(2)}</b></div>`;
      if (item.benchmark_fob_usd_gold) colorTiers += `<div class="ref-badge">Goud/Nickel<br><b>$${item.benchmark_fob_usd_gold.toFixed(2)}</b></div>`;
      if (item.benchmark_fob_usd_gunmetal) colorTiers += `<div class="ref-badge">Gun Metal<br><b>$${item.benchmark_fob_usd_gunmetal.toFixed(2)}</b></div>`;
      if (item.benchmark_fob_usd_copper) colorTiers += `<div class="ref-badge">Koper<br><b>$${item.benchmark_fob_usd_copper.toFixed(2)}</b></div>`;
      colorTiers += '</div>';
    }

    card.innerHTML = `
      <div class="card-img">${IMAGES[item.id] ? `<img src="${IMAGES[item.id]}" alt="">` : (CAT_ICONS[currentCat]||CAT_ICONS.default)}</div>
      <div class="card-title">${escapeHtml(item.name)}</div>
      <div class="card-spec">${escapeHtml(item.spec)}${item.color?' · '+escapeHtml(item.color):''}</div>
      <div class="ref-row">${refs}</div>
      ${colorTiers}
      ${item.notes ? `<div class="notes">💡 ${escapeHtml(item.notes)}</div>` : ''}
    `;
    container.appendChild(card);
  });
  // Bind
  container.querySelectorAll('input[data-id], textarea[data-id]').forEach(el => {
    el.addEventListener('input', (ev) => {
      const id = ev.target.dataset.id;
      const field = ev.target.dataset.field;
      getEntry(id)[field] = ev.target.value;
      saveState();
      if (field === 'fob') { renderStats(); renderItems(); }
    });
  });
}

function renderSupplierView() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('stats').style.display = 'none';
  document.querySelector('.toolbar').style.display = 'none';
  const container = document.getElementById('items');
  const sups = state.suppliers || [];
  const term = searchTerm.toLowerCase();
  const filtered = term ? sups.filter(s => ((s.company||'')+' '+(s.contact||'')+' '+(s.booth||'')+' '+(s.notes||'')).toLowerCase().includes(term)) : sups;
  let html = `<button class="sup-add-btn" onclick="openSupplierEditor()">+ Nieuwe leverancier toevoegen</button>`;
  html += `<div style="padding:0 12px 8px 12px;"><input class="search" style="width:100%;padding:10px 12px;border:1px solid #d0d4d9;border-radius:8px;font-size:14px;background:#fff;" placeholder="Zoek leverancier..." id="supSearch" value="${escapeHtml(searchTerm)}"></div>`;
  if (!filtered.length) {
    html += `<div class="sup-empty"><div class="icon">🏭</div><div>Nog geen leveranciers toegevoegd.<br>Tik op <b>+ Nieuwe leverancier</b> om te beginnen.</div></div>`;
  } else {
    // sort by updatedAt desc
    filtered.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    filtered.forEach(s => {
      const statusCls = s.status || '';
      const stars = s.rating ? '★'.repeat(s.rating) + '☆'.repeat(5-s.rating) : '';
      const catChips = (s.categories||[]).map(k => CATALOG[k] ? `<span class="chip">${CATALOG[k].icon} ${CATALOG[k].label}</span>` : '').join('');
      const statusLabel = {hot:'🔥 Hot', warm:'👍 Warm', cold:'❄️ Koud', done:'✅ Opgevolgd'}[s.status] || '';
      html += `<div class="sup-card ${statusCls}">
        <div class="sup-card-head">
          <div class="sup-card-photo">${s.cardPhoto ? `<img src="${s.cardPhoto}" alt="">` : '📇'}</div>
          <div class="sup-card-body">
            <div class="sup-company">${escapeHtml(s.company||'(geen naam)')}</div>
            ${s.contact ? `<div class="sup-contact">${escapeHtml(s.contact)}</div>` : ''}
            <div class="sup-meta">
              ${s.booth ? `<span class="chip">📍 ${escapeHtml(s.booth)}</span>` : ''}
              ${s.phase ? `<span class="chip phase">Fase ${s.phase}</span>` : ''}
              ${statusLabel ? `<span class="chip status-${s.status}">${statusLabel}</span>` : ''}
              ${stars ? `<span class="sup-rating">${stars}</span>` : ''}
            </div>
            ${catChips ? `<div class="sup-meta" style="margin-top:6px;">${catChips}</div>` : ''}
            ${s.notes ? `<div class="sup-notes">${escapeHtml(s.notes)}</div>` : ''}
          </div>
        </div>
        <div class="sup-actions">
          <button onclick="openSupplierEditor('${s.id}')">✎ Bewerken</button>
          ${s.phone ? `<button onclick="window.location.href='tel:${escapeHtml(s.phone)}'">📞 Bel</button>` : ''}
          ${s.email ? `<button onclick="window.location.href='mailto:${escapeHtml(s.email)}'">✉ Mail</button>` : ''}
          <button class="del" onclick="deleteSupplier('${s.id}')">🗑</button>
        </div>
      </div>`;
    });
  }
  container.innerHTML = html;
  // rebind search
  const ss = document.getElementById('supSearch');
  if (ss) ss.addEventListener('input', e => { searchTerm = e.target.value; renderSupplierView(); });
}

function openSupplierEditor(id) {
  const existing = id ? (state.suppliers||[]).find(s => s.id === id) : null;
  const s = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: 'sup_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    company:'', contact:'', booth:'', phase:'2', categories:[], phone:'', wechat:'', email:'', notes:'', rating:0, status:'', cardPhoto:'', createdAt: Date.now()
  };
  const catChips = Object.keys(CATALOG).map(k => {
    const c = CATALOG[k];
    const on = s.categories.includes(k);
    return `<div class="cat-chip ${on?'on':''}" data-cat="${k}">${c.icon} ${c.label}</div>`;
  }).join('');
  const statusBtns = [['hot','🔥 Hot'],['warm','👍 Warm'],['cold','❄️ Koud'],['done','✅ Opgevolgd']].map(([v,l]) =>
    `<div class="status-btn ${s.status===v?'on':''}" data-status="${v}">${l}</div>`).join('');
  const phases = [['1','Fase 1'],['2','Fase 2'],['3','Fase 3']].map(([v,l]) =>
    `<option value="${v}" ${s.phase===v?'selected':''}>${l}</option>`).join('');
  const stars = [1,2,3,4,5].map(n => `<span class="star ${n<=s.rating?'on':''}" data-star="${n}">★</span>`).join('');
  const editor = `<div class="sup-edit">
    <h3>${existing ? 'Leverancier bewerken' : 'Nieuwe leverancier'}</h3>
    <label>Bedrijfsnaam</label>
    <input type="text" id="f_company" value="${escapeHtml(s.company)}">
    <label>Contactpersoon</label>
    <input type="text" id="f_contact" value="${escapeHtml(s.contact)}">
    <div class="row2">
      <div>
        <label>Stand (hal + booth)</label>
        <input type="text" id="f_booth" value="${escapeHtml(s.booth)}" placeholder="bv. 10.2 B08">
      </div>
      <div>
        <label>Canton fase</label>
        <select id="f_phase"><option value="">—</option>${phases}</select>
      </div>
    </div>
    <label>Categorieën (tik meerdere aan)</label>
    <div class="cat-chips" id="f_cats">${catChips}</div>
    <div class="row2">
      <div>
        <label>Telefoon</label>
        <input type="tel" id="f_phone" value="${escapeHtml(s.phone)}">
      </div>
      <div>
        <label>WeChat ID</label>
        <input type="text" id="f_wechat" value="${escapeHtml(s.wechat)}">
      </div>
    </div>
    <label>Email</label>
    <input type="email" id="f_email" value="${escapeHtml(s.email)}">
    <label>Status</label>
    <div class="status-row" id="f_status">${statusBtns}</div>
    <label>Waardering</label>
    <div class="star-row" id="f_rating">${stars}</div>
    <label>Notities</label>
    <textarea id="f_notes" placeholder="MOQ, betaaltermijn, Engels niveau, bijzonderheden...">${escapeHtml(s.notes)}</textarea>
    <label>Visitekaartje</label>
    <div class="photo-area" id="f_photo_area" onclick="document.getElementById('f_photo_input').click()">
      ${s.cardPhoto ? `<img src="${s.cardPhoto}" alt="">` : '<div style="font-size:36px;">📷</div><div class="hint">Tik om foto te maken of kiezen</div>'}
    </div>
    <input type="file" id="f_photo_input" accept="image/*" capture="environment" style="display:none;">
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeSupEditor()">Annuleer</button>
      <button class="btn-primary" onclick="saveSupplier('${s.id}', ${existing?'true':'false'})">Opslaan</button>
    </div>
  </div>`;
  const modal = document.getElementById('modal');
  modal.querySelector('.modal-box').outerHTML = editor;
  modal.classList.add('open');
  // Bind working state on modal element
  modal._sup = s;
  // Bind category chips
  modal.querySelectorAll('#f_cats .cat-chip').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.cat;
      const i = s.categories.indexOf(k);
      if (i >= 0) { s.categories.splice(i,1); el.classList.remove('on'); }
      else { s.categories.push(k); el.classList.add('on'); }
    };
  });
  // Status buttons
  modal.querySelectorAll('#f_status .status-btn').forEach(el => {
    el.onclick = () => {
      const v = el.dataset.status;
      s.status = (s.status === v) ? '' : v;
      modal.querySelectorAll('#f_status .status-btn').forEach(b => b.classList.toggle('on', b.dataset.status === s.status));
    };
  });
  // Stars
  modal.querySelectorAll('#f_rating .star').forEach(el => {
    el.onclick = () => {
      const n = parseInt(el.dataset.star);
      s.rating = (s.rating === n) ? n-1 : n;
      modal.querySelectorAll('#f_rating .star').forEach(st => st.classList.toggle('on', parseInt(st.dataset.star) <= s.rating));
    };
  });
  // Photo input
  document.getElementById('f_photo_input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        // Resize: longest side max 1200px, JPEG 0.72
        const maxSide = 1200;
        let w = img.width, hh = img.height;
        if (w > hh) {
          if (w > maxSide) { hh = hh * maxSide / w; w = maxSide; }
        } else {
          if (hh > maxSide) { w = w * maxSide / hh; hh = maxSide; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = hh;
        cv.getContext('2d').drawImage(img, 0, 0, w, hh);
        s.cardPhoto = cv.toDataURL('image/jpeg', 0.72);
        const area = document.getElementById('f_photo_area');
        area.innerHTML = `<img src="${s.cardPhoto}" alt="">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });
}

function closeSupEditor() {
  document.getElementById('modal').classList.remove('open');
  // Restore default modal content
  renderSupplierView();
}

function saveSupplier(id, isUpdate) {
  const modal = document.getElementById('modal');
  const s = modal._sup;
  s.company = document.getElementById('f_company').value.trim();
  s.contact = document.getElementById('f_contact').value.trim();
  s.booth = document.getElementById('f_booth').value.trim();
  s.phase = document.getElementById('f_phase').value;
  s.phone = document.getElementById('f_phone').value.trim();
  s.wechat = document.getElementById('f_wechat').value.trim();
  s.email = document.getElementById('f_email').value.trim();
  s.notes = document.getElementById('f_notes').value.trim();
  s.updatedAt = Date.now();
  if (!state.suppliers) state.suppliers = [];
  if (isUpdate) {
    const i = state.suppliers.findIndex(x => x.id === id);
    if (i >= 0) state.suppliers[i] = s; else state.suppliers.push(s);
  } else {
    state.suppliers.push(s);
  }
  try {
    saveState();
  } catch(err) {
    alert('Opslaan mislukt — mogelijk is de opslag vol (localStorage limit). Verwijder oude leveranciers of verklein foto.');
    return;
  }
  modal.classList.remove('open');
  // Rebuild modal box HTML for export view
  modal.innerHTML = `<div class="modal-box"><h3 id="modalTitle">Export</h3><textarea id="modalText"></textarea><div class="btn-row"><button class="btn-secondary" onclick="copyModal()">Kopieer</button><button class="btn-primary" onclick="closeModal()">Sluit</button></div></div>`;
  renderSupplierView();
}

function deleteSupplier(id) {
  if (!confirm('Deze leverancier verwijderen?')) return;
  state.suppliers = (state.suppliers||[]).filter(s => s.id !== id);
  saveState();
  renderSupplierView();
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll() {
  renderTabs();
  if (currentCat === 'suppliers') {
    renderSupplierView();
  } else {
    document.getElementById('intro').style.display = '';
    document.getElementById('stats').style.display = '';
    document.querySelector('.toolbar').style.display = '';
    renderIntro(); renderStats(); renderItems();
  }
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderItems();
});
document.getElementById('rate').addEventListener('input', e => {
  state.rate = e.target.value;
  saveState();
  renderStats(); renderItems();
});
document.getElementById('onlyFilled').addEventListener('click', e => {
  onlyFilledFilter = !onlyFilledFilter;
  e.target.style.background = onlyFilledFilter ? '#1F3864' : '#f0f2f5';
  e.target.style.color = onlyFilledFilter ? '#fff' : '#1F3864';
  renderItems();
});

function exportData() {
  // CSV export — products + suppliers
  const lines = [['Categorie','Item','Spec','Kleur','Leverancier','Offerte FOB','Currency','Offerte EUR','Target FOB EUR','Target VKP EUR','Factor','Status','Notitie'].join(',')];
  const rate = parseFloat(state.rate) || 0.92;
  // Product reference (benchmarks only, no offers since they go via suppliers)
  Object.keys(CATALOG).forEach(ck => {
    CATALOG[ck].items.forEach(item => {
      const row = [CATALOG[ck].label, item.name, item.spec||'', item.color||'', '', '', item.currency||'', '', item.target_fob_eur||'', item.target_vkp_eur||'', '', '', ''];
      lines.push(row.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
    });
  });
  // Suppliers section
  lines.push('');
  lines.push(['Bedrijf','Contact','Stand','Fase','Categorieen','Telefoon','WeChat','Email','Status','Rating','Notities','Heeft visitekaartje'].join(','));
  (state.suppliers||[]).forEach(s => {
    const cats = (s.categories||[]).map(k => CATALOG[k]?CATALOG[k].label:k).join('; ');
    const row = [s.company||'', s.contact||'', s.booth||'', s.phase||'', cats, s.phone||'', s.wechat||'', s.email||'', s.status||'', s.rating||'', (s.notes||'').replace(/\n/g,' '), s.cardPhoto?'ja':'nee'];
    lines.push(row.map(v => { const str=String(v); return /[,"\n]/.test(str)?'"'+str.replace(/"/g,'""')+'"':str; }).join(','));
  });
  const csv = lines.join('\n');
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = 'Export CSV (kopieer, plak in Excel)';
  document.getElementById('modalText').value = csv;
  modal.classList.add('open');
}
function importData() {
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = 'Import JSON (plak eerder geexporteerde state)';
  document.getElementById('modalText').value = JSON.stringify(state, null, 2);
  modal.classList.add('open');
  document.getElementById('modalText').onblur = () => {
    try { state = JSON.parse(document.getElementById('modalText').value); saveState(); renderAll(); } catch(e){}
  };
}
function copyModal() {
  const t = document.getElementById('modalText');
  t.select();
  document.execCommand('copy');
  alert('Gekopieerd');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function resetData() {
  if (confirm('Alle ingevulde prijzen wissen? (Leveranciers blijven staan)')) {
    state.entries = {};
    saveState();
    renderAll();
  }
}

// Init
document.getElementById('rate').value = state.rate;
renderAll();
</script>
</body>
</html>
